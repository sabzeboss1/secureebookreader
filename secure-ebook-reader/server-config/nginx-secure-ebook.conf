# ==============================================================================
# Secure Ebook Reader — Directive de Protection Serveur Nginx
# ==============================================================================
# Si votre site WordPress fonctionne sous Nginx, ajoutez cette directive dans le
# bloc "server { ... }" de votre fichier de configuration de virtual host :
# (/etc/nginx/sites-available/monsite.conf)
# ==============================================================================

# Bloque immédiatement tout accès direct aux PDF stockés dans le coffre-fort
location ^~ /wp-content/uploads/secure-ebooks-vault/ {
    deny all;
    return 403;
}
